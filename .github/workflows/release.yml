---
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  release:
    name: Release + attestations
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Package plugin tarball
        run: |
          NAME="linkedin-chrome-copilot-${TAG_NAME}"
          mkdir -p dist
          tar --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --exclude='./.git' --exclude='./dist' --exclude='./.stversions' \
              -czf "dist/${NAME}.tar.gz" .
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Generate SBOMs (CycloneDX 1.6 + SPDX 2.3)
        run: |
          syft . \
            -o cyclonedx-json@1.6=dist/sbom.cdx.json \
            -o spdx-json=dist/sbom.spdx.json

      - name: Attest build provenance for tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/linkedin-chrome-copilot-*.tar.gz

      - name: Attest SBOM (CycloneDX)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v2.1.0
        with:
          subject-path: dist/linkedin-chrome-copilot-*.tar.gz
          sbom-path: dist/sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Semver pre-releases (v0.1.0-alpha.1, -beta, -rc) carry a hyphen;
          # stable tags (v1.2.3) do not. Keeps alphas off the "Latest" badge.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/linkedin-chrome-copilot-*.tar.gz
            dist/linkedin-chrome-copilot-*.tar.gz.sha256
            dist/sbom.cdx.json
            dist/sbom.spdx.json
          generate_release_notes: true
